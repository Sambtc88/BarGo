name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Flet and Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install flet buildozer cython==0.29.36

      - name: Initialize Buildozer Spec
        run: |
          # اگر فایل buildozer.spec ندارید، فلت خودش می‌سازد
          flet pack main.py --name "BarGo" || true

      - name: Build APK with Flet
        run: |
          flet build apk -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarGo-App
          path: |
            bin/*.apk
            build/apk/*.apk
            dist/*.apk
