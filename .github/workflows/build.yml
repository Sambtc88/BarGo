name: Build Barbarg Bandar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging setuptools wheel
          pip install flet==0.24.1 httpx==0.27.0

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK with Flet
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          flet build apk -vv --project bargo --exclude .github

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: barbarg-bandar-apk
          path: build/apk/*.apk
