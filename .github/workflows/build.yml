name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Flet
        uses: flet-dev/build-app-action@main
        with:
          target: main.py
          project_name: BarGo
          org: com.bargor.app
          android_platforms: "33"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BarGo-App
          path: output/*.apk
