name: Build Senator Barnameh APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: "stable"
          cache: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 httpx

      - name: Build APK with Flet
        run: |
          flet build apk \
            --project "SenatorBarnameh" \
            --description "Senator Anti-Disruption Permit System" \
            --org "ir.bandar.senator" \
            --build-number 1 \
            --build-version "2.0.0" \
            --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Senator-Barnameh-APK
          path: build/apk/*.apk
          if-no-files-found: error
