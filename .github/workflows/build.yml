name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet httpx

      - name: Build APK with Flet
        run: |
          flet pack main.py --android

      - name: Find and Move APK
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarGo-App-New
          path: output_apk/*.apk
