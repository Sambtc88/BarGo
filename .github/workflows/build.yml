name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev libncursesw6 libstdc++6 zlib1g libbz2-dev libsqlite3-dev

      - name: Install Build Environment
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools==65.5.0" cython==0.29.36 buildozer flet httpx

      - name: Create buildozer.spec Automatically
        run: |
          # اگر فایل تنظیمات وجود ندارد، آن را می سازیم
          cat << 'EOF' > buildozer.spec
          [app]
          title = BarGo
          package.name = bargo
          package.domain = com.bargor.app
          source.include_exts = py,png,jpg,kv,atlas
          source.dir = .
          version = 1.0
          requirements = python3,flet,httpx
          orientation = portrait
          fullscreen = 0
          android.accept_sdk_license = True
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Run Buildozer
        run: |
          buildozer -v android debug

      - name: Find and Move APK
        run: |
          mkdir -p output_apk
          find bin/ -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarGo-App-New
          path: output_apk/*.apk
