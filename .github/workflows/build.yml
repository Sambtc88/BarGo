name: Build Barbarg Bandar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.2 httpx==0.27.0

      - name: Build APK with Flet
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          flet build apk --project "barbarg_bandar" --description "پنل ثبت باربرگ بندر"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: barbarg-bandar-apk
          path: build/apk/*.apk
